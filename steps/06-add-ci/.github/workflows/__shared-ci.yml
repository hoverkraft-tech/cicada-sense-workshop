---
name: Shared - Continuous Integration for common tasks

on: # yamllint disable-line rule:truthy
  workflow_call:

permissions: {}

jobs:
  build-ci:
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-build-images.yml@988ccc2b85dec5822e801d7bc0622cad7cc94870 # 4.1.0
    permissions:
      attestations: write
      contents: read
      packages: write
      issues: read
      pull-requests: read
      id-token: write
    with:
      oci-registry: ${{ vars.OCI_REGISTRY }}
      sign: false
      images: |
        [
          {
            "name": "backend-ci",
            "context": ".",
            "dockerfile": "./docker/backend/Dockerfile",
            "target": "ci",
            "platforms": ["linux/amd64"]
          },
          {
            "name": "frontend-ci",
            "context": ".",
            "dockerfile": "./docker/frontend/Dockerfile",
            "target": "ci",
            "platforms": ["linux/amd64"]
          },
          {
            "name": "live-data-generator-ci",
            "context": ".",
            "dockerfile": "./docker/live-data-generator/Dockerfile",
            "target": "ci",
            "platforms": ["linux/amd64"]
          }
        ]
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

  continuous-integration:
    name: Continuous Integration - ${{ matrix.application }}
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@98d91b1cc347efc64cd5fb20bc0ebc076acad114 # 3.1.0
    needs: build-ci
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: backend
            image: backend-ci
            path: ./application/monitoring-workspace/backend
          - application: frontend
            image: frontend-ci
            path: ./application/monitoring-workspace/frontend
          - application: live-data-generator
            image: live-data-generator-ci
            path: ./application/live-data-generator
    with:
      working-directory: /usr/src/app
      container: |
        {
          "image": ${{ toJSON(fromJSON(needs.build-ci.outputs.built-images)[matrix.image].images[0]) }},
          "credentials": {
            "username": ${{ toJson(github.repository_owner) }}
          },
          "pathMapping": {
            "/usr/src/app": "${{ matrix.path }}"
          }
        }
      dependency-review: false
    secrets:
      container-password: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: continuous-integration
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-build-images.yml@988ccc2b85dec5822e801d7bc0622cad7cc94870 # 4.1.0
    permissions:
      attestations: write
      contents: read
      packages: write
      issues: read
      pull-requests: read
      id-token: write
    with:
      oci-registry: ${{ vars.OCI_REGISTRY }}
      sign: false
      images: |
        [
          {
            "name": "backend",
            "context": ".",
            "dockerfile": "./docker/backend/Dockerfile",
            "target": "prod",
            "platforms": ["linux/amd64"]
          },
          {
            "name": "frontend",
            "context": ".",
            "dockerfile": "./docker/frontend/Dockerfile",
            "target": "prod",
            "platforms": ["linux/amd64"]
          },
          {
            "name": "live-data-generator",
            "context": ".",
            "dockerfile": "./docker/live-data-generator/Dockerfile",
            "target": "prod",
            "platforms": ["linux/amd64"]
          }
        ]
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

  tests-charts:
    name: Tests - Charts
    needs: build
    uses: hoverkraft-tech/ci-github-container/.github/workflows/helm-chart-ci.yml@988ccc2b85dec5822e801d7bc0622cad7cc94870 # 4.1.0
    permissions:
      contents: read
      packages: read
    with:
      path: charts/application
      helm-set: |
        backend.image=${{ fromJSON(needs.build.outputs.built-images).backend.images[0] }}
        frontend.image=${{ fromJSON(needs.build.outputs.built-images).frontend.images[0] }}
        live-data-generator.api.image=${{ fromJSON(needs.build.outputs.built-images)['live-data-generator'].images[0] }}
        live-data-generator.ui.image=${{ fromJSON(needs.build.outputs.built-images)['live-data-generator'].images[0] }}
        global.imagePullSecrets[0].name=regcred
      oci-registry: ${{ vars.OCI_REGISTRY }}
